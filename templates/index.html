<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Mini CBT - Question {{ question_number }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
    <div class="container">
        <h1>Mini CBT Test</h1>
        <div class="question-box">
            <h2>Question {{ question_number }} of {{ total_questions }}</h2>
            <p>{{ question.prompt }}</p>
            <form method="POST">
                {% for option in question.options %}
                <div class="option">
                    <input type="radio" id="{{ option }}" name="option" value="{{ option }}" required />
                    <label for="{{ option }}">{{ option }}</label>
                </div>
                {% endfor %}
                <button type="submit" class="btn">Submit Answer</button>
            </form>
        </div>
    </div>
</body>
</html>
